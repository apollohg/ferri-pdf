[workspace]
members = ["crates/*", "spec"]
default-members = [".", "crates/*"]
exclude = ["vendor/resvg", "vendor/krilla", "vendor/icu_casemap", "vendor/zenavif-parse", "vendor/usvg", "vendor/avif-decode", "vendor/heic-decoder", "vendor/selectors"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
# Geometry is f32 and is clamped before conversion to pixel, glyph and index domains.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# CSS algorithms compare exact computed values.
float_cmp = "allow"
# Struct fields and arguments name the type, so `Default::default()` is unambiguous.
default_trait_access = "allow"
# Test fixtures build HTML by collecting formatted fragments.
format_collect = "allow"
# Named constants sit beside the statements that use them.
items_after_statements = "allow"
# Affine matrices and Bezier points use their conventional single-letter names.
many_single_char_names = "allow"
# Match arms mirror the specification's case lists.
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Duplicate versions come from transitive dependencies.
multiple_crate_versions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[workspace.dependencies]
ferri-pdf-spec-data = { path = "spec", version = "0.1.0" }
ferri-pdf-dom = { path = "crates/dom", version = "0.1.0" }
ego-tree = "=0.11.0"
encoding_rs = "0.8.35"
html5ever = "=0.39.0"
icu_casemap = { package = "ferri-pdf-icu-casemap", path = "vendor/icu_casemap", version = "=2.3.0" }
icu_locale_core = "=2.3.0"
avif-decode = { package = "ferri-pdf-avif-decode", path = "vendor/avif-decode", version = "=3.0.0", default-features = false }
zenavif-parse = { package = "ferri-pdf-zenavif-parse", path = "vendor/zenavif-parse", version = "=0.6.2" }
url = "=2.5.8"
percent-encoding = "=2.3.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
rustls-rustcrypto = "=0.0.2-alpha"
base64 = "0.22"
heic-decoder = { package = "ferri-pdf-heic-decoder", path = "vendor/heic-decoder", version = "=0.1.1", features = ["internals"] }
moxcms = "=0.8.1"
png = "0.18"
usvg = { package = "ferri-pdf-usvg", path = "vendor/usvg", version = "=0.47.0", default-features = false, features = ["text"] }
svgtypes = "0.16"
resvg = { package = "ferri-pdf-resvg", path = "vendor/resvg", version = "=0.47.0", default-features = false, features = ["text", "raster-images"] }
fontdb = { version = "0.23", default-features = false, features = ["std"] }
skrifa = "0.42"
smallvec = { version = "1.15.1", features = ["union", "const_new", "write"] }
tiny-skia = "0.12"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ferri-pdf-images = { path = "crates/images", version = "0.1.0" }
cssparser = "0.37"
roxmltree = "0.21.2"
cssparser-color = { version = "0.5", default-features = false }
icu_properties = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
selectors = { package = "ferri-pdf-selectors", path = "vendor/selectors", version = "0.38" }
krilla = { package = "ferri-pdf-krilla", path = "vendor/krilla", version = "=0.8.2", default-features = false, features = ["raster-images"] }
rustybuzz = "0.20"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1.0"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1.12"
ttf-parser = "0.25"
thiserror = "2"
ferri-pdf-fonts = { path = "crates/fonts", version = "0.1.0" }
ferri-pdf-resources = { path = "crates/resources", version = "0.1.0", default-features = false }
ferri-pdf-style = { path = "crates/style", version = "0.1.0" }
ferri-pdf-document = { path = "crates/document", version = "0.1.0" }
ferri-pdf-flex = { path = "crates/flex", version = "0.1.0" }
ferri-pdf-grid = { path = "crates/grid", version = "0.1.0" }
ferri-pdf-table = { path = "crates/table", version = "0.1.0" }
ferri-pdf-graphics = { path = "crates/graphics", version = "0.1.0" }
ferri-pdf-paint = { path = "crates/paint", version = "0.1.0" }

[package]
name = "ferri-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
exclude = [".private/**", ".superpowers/**", "tmp/**"]

[lints]
workspace = true

[features]
default = ["http"]
# HTTP(S) resource fetching through `UrlResolver`.
http = ["ferri-pdf-resources/http"]

[[test]]
name = "remote"
required-features = ["http"]

[dependencies]
ferri-pdf-images.workspace = true
ferri-pdf-fonts.workspace = true
ferri-pdf-resources.workspace = true
ferri-pdf-style.workspace = true
ferri-pdf-document.workspace = true
ferri-pdf-graphics.workspace = true
thiserror.workspace = true
serde_json.workspace = true
same-file.workspace = true
usvg.workspace = true
krilla.workspace = true
resvg.workspace = true
fontdb.workspace = true
skrifa.workspace = true
smallvec.workspace = true
tiny-skia.workspace = true
ferri-pdf-table.workspace = true
ferri-pdf-flex.workspace = true
ferri-pdf-grid.workspace = true
serde.workspace = true
rustybuzz.workspace = true
icu_properties.workspace = true
icu_casemap.workspace = true
icu_locale_core.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-script.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
roxmltree.workspace = true
ferri-pdf-dom.workspace = true
