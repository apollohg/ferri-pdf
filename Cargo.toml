[workspace]
members = ["spec"]
default-members = ["."]
exclude = ["vendor/krilla", "vendor/icu_casemap", "vendor/zenavif-parse", "vendor/avif-decode", "vendor/heic-decoder", "vendor/selectors"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
# Geometry is f32 and is clamped before conversion to pixel, glyph and index domains.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# CSS algorithms compare exact computed values.
float_cmp = "allow"
# Struct fields and arguments name the type, so `Default::default()` is unambiguous.
default_trait_access = "allow"
# Test fixtures build HTML by collecting formatted fragments.
format_collect = "allow"
# Named constants sit beside the statements that use them.
items_after_statements = "allow"
# Affine matrices and Bezier points use their conventional single-letter names.
many_single_char_names = "allow"
# Match arms mirror the specification's case lists.
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Duplicate versions come from transitive dependencies.
multiple_crate_versions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[workspace.dependencies]
ferri-pdf-spec-data = { path = "spec", version = "0.1.0" }
ego-tree = "=0.11.0"
encoding_rs = "0.8.35"
html5ever = "=0.39.0"
icu_casemap = { package = "ferri-pdf-icu-casemap", path = "vendor/icu_casemap", version = "=2.3.0" }
icu_locale_core = "=2.3.0"
avif-decode = { package = "ferri-pdf-avif-decode", path = "vendor/avif-decode", version = "=3.0.0", default-features = false }
zenavif-parse = { package = "ferri-pdf-zenavif-parse", path = "vendor/zenavif-parse", version = "=0.6.2" }
url = "=2.5.8"
percent-encoding = "=2.3.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
rustls-rustcrypto = "=0.0.2-alpha"
base64 = "0.22"
heic-decoder = { package = "ferri-pdf-heic-decoder", path = "vendor/heic-decoder", version = "=0.1.1", features = ["internals"] }
moxcms = "=0.8.1"
png = "0.18"
data-url = "0.3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
imagesize = "0.14.0"
kurbo = "0.13.0"
siphasher = "1.0"
strict-num = "0.1.1"
tiny-skia-path = "0.12.0"
unicode-vo = "0.1"
xmlwriter = "0.1"
svgtypes = "0.16"
log = "0.4"
rgb = "0.8"
gif = "0.14.1"
image-webp = "0.2.4"
zune-jpeg = "0.5.8"
fontdb = { version = "0.23", default-features = false, features = ["std"] }
skrifa = "0.42"
smallvec = { version = "1.15.1", features = ["union", "const_new", "write"] }
tiny-skia = "0.12"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
cssparser = "0.37"
roxmltree = "0.21.2"
cssparser-color = { version = "0.5", default-features = false }
icu_properties = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
selectors = { package = "ferri-pdf-selectors", path = "vendor/selectors", version = "0.38" }
krilla = { package = "ferri-pdf-krilla", path = "vendor/krilla", version = "=0.8.2", default-features = false, features = ["raster-images"] }
rustybuzz = "0.20"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1.0"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1.12"
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
thiserror = "2"

[package]
name = "ferri-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
exclude = [".private/**", ".superpowers/**", "tmp/**"]

[lints]
workspace = true

[features]
default = ["http"]
# HTTP(S) resource fetching through `UrlResolver`.
http = ["dep:ureq", "dep:rustls-rustcrypto"]

[[test]]
name = "remote"
required-features = ["http"]

[build-dependencies]
ferri-pdf-spec-data.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dependencies]
thiserror.workspace = true
serde_json.workspace = true
same-file.workspace = true
krilla.workspace = true
fontdb.workspace = true
skrifa.workspace = true
smallvec.workspace = true
tiny-skia.workspace = true
serde = { workspace = true, features = ["rc"] }
rustybuzz.workspace = true
icu_properties.workspace = true
icu_casemap.workspace = true
icu_locale_core.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-script.workspace = true
unicode-segmentation.workspace = true
encoding_rs.workspace = true
percent-encoding.workspace = true
log.workspace = true
rgb.workspace = true
svgtypes.workspace = true
gif.workspace = true
image-webp.workspace = true
zune-jpeg.workspace = true
avif-decode.workspace = true
zenavif-parse.workspace = true
heic-decoder.workspace = true
moxcms.workspace = true
png.workspace = true
image.workspace = true
roxmltree.workspace = true
base64.workspace = true
data-url.workspace = true
flate2.workspace = true
imagesize.workspace = true
kurbo.workspace = true
cssparser.workspace = true
siphasher.workspace = true
strict-num.workspace = true
tiny-skia-path.workspace = true
ttf-parser.workspace = true
unicode-vo.workspace = true
xmlwriter.workspace = true

ferri-pdf-spec-data.workspace = true
cssparser-color.workspace = true
html5ever.workspace = true
scraper.workspace = true
ego-tree.workspace = true
selectors.workspace = true
url.workspace = true
ureq = { workspace = true, optional = true }
rustls-rustcrypto = { workspace = true, optional = true }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
