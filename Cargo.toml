[workspace]
exclude = ["vendor/krilla", "vendor/icu_casemap", "vendor/zenavif-parse", "vendor/avif-decode", "vendor/heic-decoder", "vendor/selectors"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
# Geometry is f32 and is clamped before conversion to pixel, glyph and index domains.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# CSS algorithms compare exact computed values.
float_cmp = "allow"
# Struct fields and arguments name the type, so `Default::default()` is unambiguous.
default_trait_access = "allow"
# Test fixtures build HTML by collecting formatted fragments.
format_collect = "allow"
# Named constants sit beside the statements that use them.
items_after_statements = "allow"
# Affine matrices and Bezier points use their conventional single-letter names.
many_single_char_names = "allow"
# Match arms mirror the specification's case lists.
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Duplicate versions come from transitive dependencies.
multiple_crate_versions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[workspace.dependencies]
ego-tree = "=0.11.0"
encoding_rs = "0.8.35"
html5ever = "=0.39.0"
icu_casemap = { package = "ferri-pdf-icu-casemap", path = "vendor/icu_casemap", version = "=2.3.0" }
icu_locale_core = "=2.3.0"
avif-decode = { package = "ferri-pdf-avif-decode", path = "vendor/avif-decode", version = "=3.0.0", default-features = false }
zenavif-parse = { package = "ferri-pdf-zenavif-parse", path = "vendor/zenavif-parse", version = "=0.6.2" }
url = "=2.5.8"
percent-encoding = "=2.3.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
rustls-rustcrypto = "=0.0.2-alpha"
base64 = "0.22"
heic-decoder = { package = "ferri-pdf-heic-decoder", path = "vendor/heic-decoder", version = "=0.1.1", features = ["internals"] }
moxcms = "=0.8.1"
png = "0.18"
data-url = "0.3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
imagesize = "0.14.0"
kurbo = "0.13.0"
siphasher = "1.0"
strict-num = "0.1.1"
tiny-skia-path = "0.12.0"
unicode-vo = "0.1"
xmlwriter = "0.1"
svgtypes = "0.16"
log = "0.4"
rgb = "0.8"
gif = "0.14.1"
# Rasterizes display-list subtrees that filters and additive blending composite in pixels.
hayro = { version = "=0.8.0", default-features = false }
image-webp = "0.2.4"
zune-jpeg = "0.5.8"
fontdb = { version = "0.23", default-features = false, features = ["std"] }
skrifa = "0.42"
smallvec = { version = "1.15.1", features = ["union", "const_new", "write"] }
tiny-skia = "0.12"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
cssparser = "0.37"
roxmltree = "0.21.2"
regress = "0.12"
icu_normalizer = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
selectors = { package = "ferri-pdf-selectors", path = "vendor/selectors", version = "0.38" }
krilla = { package = "ferri-pdf-krilla", path = "vendor/krilla", version = "=0.8.3", default-features = false, features = ["raster-images"] }
rustybuzz = "0.20"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1.0"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1.12"
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
thiserror = "2"
# Only languages whose patterns are MIT, BSD-3-Clause, Unlicense or FSFAP-no-warranty-disclaimer
# licensed; assets/hyphenation/PATTERNS.txt carries their notices.
hypher = { version = "=0.1.8", default-features = false, features = [
    "alloc",
    "albanian",
    "assamese",
    "belarusian",
    "bengali",
    "czech",
    "danish",
    "english",
    "estonian",
    "finnish",
    "french",
    "galician",
    "german",
    "gujarati",
    "hindi",
    "italian",
    "kannada",
    "latin",
    "lithuanian",
    "malayalam",
    "marathi",
    "mongolian",
    "oriya",
    "panjabi",
    "polish",
    "portuguese",
    "slovenian",
    "spanish",
    "tamil",
    "telugu",
    "turkmen",
] }

[package]
name = "ferri-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Own code, inlined SVG libraries, CLDR and mdn-data, the DejaVu and Liberation fonts, then
# the hyphenation patterns embedded through hypher.
license = "MIT AND (Apache-2.0 OR MIT) AND Unicode-3.0 AND CC0-1.0 AND Bitstream-Vera AND LicenseRef-Arev AND OFL-1.1-RFN AND BSD-3-Clause AND Unlicense AND FSFAP-no-warranty-disclaimer"
description = "HTML and CSS to PDF renderer for print, in pure Rust"
repository = "https://github.com/apollohg/ferri-pdf"
keywords = ["pdf", "html", "css", "print", "renderer"]
categories = ["rendering", "text-processing", "command-line-utilities"]
include = [
    "/build.rs",
    "/build/**",
    "/src/**",
    "/spec/css/**",
    "/spec/languages/**",
    "/spec/cldr/**",
    "/spec/emoji/**",
    "/assets/**",
    "/LICENSE",
    "/README.md",
]

[lints]
workspace = true

[features]
default = ["http"]
# HTTP(S) resource fetching through `UrlResolver`.
http = ["dep:ureq", "dep:rustls-rustcrypto"]

[[test]]
name = "remote"
required-features = ["http"]

[build-dependencies]
serde_json.workspace = true
thiserror.workspace = true

[dependencies]
avif-decode.workspace = true
base64.workspace = true
cssparser.workspace = true
data-url.workspace = true
ego-tree.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
fontdb.workspace = true
gif.workspace = true
hayro.workspace = true
heic-decoder.workspace = true
html5ever.workspace = true
hypher.workspace = true
icu_casemap.workspace = true
icu_locale_core.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
image-webp.workspace = true
image.workspace = true
imagesize.workspace = true
krilla.workspace = true
kurbo.workspace = true
log.workspace = true
moxcms.workspace = true
percent-encoding.workspace = true
png.workspace = true
regress.workspace = true
rgb.workspace = true
roxmltree.workspace = true
rustls-rustcrypto = { workspace = true, optional = true }
rustybuzz.workspace = true
same-file.workspace = true
scraper.workspace = true
selectors.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
siphasher.workspace = true
skrifa.workspace = true
smallvec.workspace = true
strict-num.workspace = true
svgtypes.workspace = true
thiserror.workspace = true
tiny-skia-path.workspace = true
tiny-skia.workspace = true
ttf-parser.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-script.workspace = true
unicode-segmentation.workspace = true
unicode-vo.workspace = true
ureq = { workspace = true, optional = true }
url.workspace = true
xmlwriter.workspace = true
zenavif-parse.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
