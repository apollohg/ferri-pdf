<!doctype html><html lang="en"><head><meta charset="utf-8"><title>table-fixed</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }
@page { size: 360pt 480pt; margin: 36pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Spike; font-size: 12pt; line-height: 18pt; }
p { margin: 0 0 12pt; widows: 2; orphans: 2; hyphens: none; }
.new-page { break-before: page; }
.keep { break-inside: avoid; }
table{table-layout:fixed;width:180pt;border-spacing:4pt 6pt;border:2pt solid navy}td{border:1pt solid maroon;padding:3pt}</style></head><body><table><colgroup><col style="width:60pt"><col></colgroup><tr><td>A</td><td>Longer words wrap in this table</td></tr><tr><td>BBB</td><td>C</td></tr></table><p>After</p></body></html>
