<!doctype html><html lang="en"><head><meta charset="utf-8"><title>page-fill-rounding</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }
@page { size: 360pt 480pt; margin: 36pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Spike; font-size: 12pt; line-height: 18pt; }
p { margin: 0 0 12pt; widows: 2; orphans: 2; hyphens: none; }
.new-page { break-before: page; }
.keep { break-inside: avoid; }
@page{size:A4 landscape;margin:0}main{box-sizing:border-box;height:210mm;padding:8mm}section{box-sizing:border-box;height:100%;padding:3mm;border:2.5mm solid navy}div{box-sizing:border-box;height:100%;border:0.6mm solid maroon}p{margin:0}</style></head><body><main><section><div><p>Inner frame</p></div></section></main><p>Second page</p></body></html>
