<!doctype html><html lang="en"><head><meta charset="utf-8"><title>table-collapse-empty-cells</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }

p { margin: 0 0 12pt; widows: 2; orphans: 2; hyphens: none; }
