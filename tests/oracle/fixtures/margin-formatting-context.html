<!doctype html><html lang="en"><head><meta charset="utf-8"><title>margin-formatting-context</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }
@page { size: 360pt 480pt; margin: 36pt; }

body { font-family: Spike; font-size: 12pt; line-height: 18pt; }
