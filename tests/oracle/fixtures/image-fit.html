<!doctype html><html lang="en"><head><meta charset="utf-8"><title>image-fit</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }
@page { size: 360pt 480pt; margin: 36pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Spike; font-size: 12pt; line-height: 18pt; }
p { margin: 0 0 12pt; widows: 2; orphans: 2; hyphens: none; }
.new-page { break-before: page; }
.keep { break-inside: avoid; }
img{display:block;width:80pt;height:35pt;padding:2pt;border:1pt solid navy;margin-bottom:5pt;background:#ffffcc}.contain{object-fit:contain}.cover{object-fit:cover}.none{object-fit:none}.scale-down{object-fit:scale-down}</style></head><body><img class="fill" src="../assets/image-pattern.png"><img class="contain" src="../assets/image-pattern.png"><img class="cover" src="../assets/image-pattern.png"><img class="none" src="../assets/image-pattern.png"><img class="scale-down" src="../assets/image-pattern.png"></body></html>
