<!doctype html><html lang="en"><head><meta charset="utf-8"><title>grid</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }
@page { size: 360pt 480pt; margin: 36pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Spike; font-size: 12pt; line-height: 18pt; }
p { margin: 0 0 12pt; widows: 2; orphans: 2; hyphens: none; }
.new-page { break-before: page; }
.keep { break-inside: avoid; }
.grid { display: grid; grid-template-columns: 1fr 2fr; gap: 12pt; }</style></head><body><div class="grid"><p>First</p><p>Second</p><p>Third</p></div></body></html>
