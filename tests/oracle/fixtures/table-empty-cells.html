<!doctype html><html lang="en"><head><meta charset="utf-8"><title>table-empty-cells</title><style>@font-face { font-family: Spike; src: url('../assets/DejaVuSans.ttf'); }

body { font-family: Spike; font-size: 12pt; line-height: 18pt; }
p { margin: 0 0 12pt; widows: 2; orphans: 2; hyphens: none; }

.keep { break-inside: avoid; }
