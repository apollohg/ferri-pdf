<!doctype html><html lang="en"><head><meta charset="utf-8"><title>body-string-modes</title><style>@font-face { font-family: Probe; src: url('../assets/DejaVuSans.ttf'); }
@page { size: 500pt 300pt; margin: 36pt; }
html, body { margin: 0; padding: 0; }
body { font: 10pt/15pt Probe; }
p, h2 { margin: 0; font: inherit; }
h2 { string-set: heading content(); break-after: auto; }
.next { break-before: page; }
