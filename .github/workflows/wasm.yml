name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1
  # Must equal the `wasm-bindgen` version in Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.129
  # The oldest Node the package supports.
  NODE_VERSION: "18"
  TYPESCRIPT_VERSION: 5.8.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: >
          cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --lib
          -p ferri-pdf -p ferri-pdf-wasm -- -D warnings
      - run: cargo install wasm-bindgen-cli --locked --version "$WASM_BINDGEN_VERSION"
      # The suite compares the module's output with the native renderer's.
      - run: cargo build --release --locked --bin ferri-pdf
      - run: npm run build
        working-directory: wasm
      - run: npm test
        working-directory: wasm
        env:
          FERRI_PDF_CLI: ${{ github.workspace }}/target/release/ferri-pdf
      - run: |
          npx --yes --package "typescript@$TYPESCRIPT_VERSION" tsc -p tests/types/tsconfig.node.json
          npx --yes --package "typescript@$TYPESCRIPT_VERSION" tsc -p tests/types/tsconfig.browser.json
        working-directory: wasm
