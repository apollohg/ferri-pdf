name: Publish crates

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/krilla/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/icu_casemap/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/zenavif-parse/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/rav1d/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/avif-decode/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/heic-decoder/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: vendor/selectors/Cargo.toml
      - uses: ./.github/actions/publish-crate
        with:
          manifest-path: Cargo.toml
