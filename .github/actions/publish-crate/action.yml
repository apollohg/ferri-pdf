name: Publish crate
description: Verify and publish an unpublished crate version using crates.io Trusted Publishing

inputs:
  manifest-path:
    description: Path to the crate manifest
    required: true

runs:
  using: composite
  steps:
    - name: Check published version
      id: version
      shell: python
      env:
        MANIFEST_PATH: ${{ inputs.manifest-path }}
      run: |
        from http import HTTPStatus
        import json
        import os
        import subprocess
        from urllib.error import HTTPError
        from urllib.request import Request, urlopen

        REGISTRY_API = 'https://crates.io/api/v1/crates'
        REQUEST_TIMEOUT_SECONDS = 30
        metadata = json.loads(subprocess.check_output([
            'cargo', 'metadata', '--no-deps', '--format-version', '1',
            '--manifest-path', os.environ['MANIFEST_PATH'],
        ], text=True))
        package = next(package for package in metadata['packages']
                       if os.path.samefile(package['manifest_path'], os.environ['MANIFEST_PATH']))
        name, version = package['name'], package['version']
        request = Request(f'{REGISTRY_API}/{name}/{version}', headers={
            'User-Agent': f"{os.environ['GITHUB_REPOSITORY']} release workflow",
        })
        try:
            with urlopen(request, timeout=REQUEST_TIMEOUT_SECONDS) as response:
                published = json.load(response)['version']
            if published['yanked']:
                raise SystemExit(f'{name} {version} is yanked; bump the version before releasing')
        except HTTPError as error:
            with error:
                if error.code != HTTPStatus.NOT_FOUND:
                    raise
            missing = True
        else:
            missing = False
        print(f"{name} {version}: {'publishing' if missing else 'already published; skipping'}", flush=True)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'missing={str(missing).lower()}\n')
    - name: Verify package
      if: steps.version.outputs.missing == 'true'
      shell: bash
      env:
        MANIFEST_PATH: ${{ inputs.manifest-path }}
      run: cargo publish --dry-run --registry crates-io --manifest-path "$MANIFEST_PATH"
    - name: Authenticate with crates.io
      if: steps.version.outputs.missing == 'true'
      id: auth
      uses: rust-lang/crates-io-auth-action@v1
    - name: Publish package
      if: steps.version.outputs.missing == 'true'
      shell: bash
      env:
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: cargo publish --no-verify --registry crates-io --manifest-path "$MANIFEST_PATH"
